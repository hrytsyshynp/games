<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Адміністратор бази учнів — гра про захист даних у таблицях і БД</title>
<style>
  :root{ --bg:#eef2ef; --win:#fff; --bar:#217346; --bar2:#185c37; --line:#d4ddd6; --grid:#e3e9e4; --text:#1c2b22; --muted:#66786c; --acc:#217346; --ok:#1e8a4c; --mid:#c98a00; --bad:#c8372d; --hl:#fff6c2; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
  .bar{background:var(--bar);color:#fff;padding:9px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .bar b{font-size:16px}
  .bar .db{font-family:Consolas,monospace;font-size:13px;background:var(--bar2);padding:3px 9px;border-radius:4px}
  .bar .sc{margin-left:auto;font-size:14px}
  .ribbon{background:#f7f9f7;border-bottom:1px solid var(--line);padding:6px 16px;display:flex;gap:4px;flex-wrap:wrap}
  .ribbon span{font-size:12.5px;padding:4px 10px;border-radius:4px;color:var(--muted)}
  .ribbon span.on{background:#dceee3;color:var(--acc);font-weight:600}
  .wrap{max-width:1000px;margin:0 auto;padding:14px}
  .card{background:var(--win);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:12px}
  h1{margin:0 0 6px;font-size:21px}
  .task{background:#e6f3eb;border-left:4px solid var(--acc);padding:10px 12px;border-radius:4px;line-height:1.5;font-size:15px;margin:6px 0 12px}
  p{line-height:1.55;font-size:15px;margin:6px 0 10px}
  .tbl{overflow:auto;border:1px solid var(--line);border-radius:4px;margin:8px 0}
  table.g{border-collapse:collapse;font-size:13px;min-width:100%}
  table.g th{background:#f2f5f3;border:1px solid var(--grid);padding:6px 8px;text-align:left;font-weight:600;white-space:nowrap}
  table.g td{border:1px solid var(--grid);padding:5px 8px;white-space:nowrap}
  table.g td.rn,table.g th.rn{background:#f2f5f3;color:var(--muted);text-align:center;width:30px}
  table.g th.off,table.g td.off{color:#b9c4bc;text-decoration:line-through;background:#fafbfa}
  table.g td.chg{background:var(--hl)}
  .cols{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .cols label{font-size:13.5px;border:1px solid var(--line);border-radius:5px;padding:5px 9px;display:flex;align-items:center;gap:6px;cursor:pointer;background:#fff}
  .cols label.g{border-color:var(--ok);background:#e3f4ea}.cols label.w{border-color:var(--bad);background:#fbe5e2}
  .anon{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
  .anon div{border:1px solid var(--line);border-radius:6px;padding:8px}
  .anon div.g{border-color:var(--ok);background:#e3f4ea}.anon div.m{border-color:var(--mid);background:#fbf1d6}.anon div.w{border-color:var(--bad);background:#fbe5e2}
  .anon b{display:block;font-size:13px;margin-bottom:5px}
  select{font:inherit;font-size:13px;padding:5px;border:1px solid var(--line);border-radius:4px;width:100%}
  .choice{display:block;width:100%;text-align:left;margin:8px 0;padding:10px 12px;border-radius:6px;font:inherit;font-size:14.5px;background:#fff;border:1px solid var(--line);cursor:pointer;white-space:pre-wrap}
  .choice code,.choice.code{font-family:Consolas,monospace;font-size:13.5px}
  .choice:hover:not(:disabled){border-color:var(--acc)}
  .choice:disabled{opacity:.55;cursor:default}
  .choice.picked{opacity:1;border-width:2px}
  .choice.picked.best{border-color:var(--ok);background:#e3f4ea}.choice.picked.ok{border-color:var(--mid);background:#fbf1d6}.choice.picked.bad{border-color:var(--bad);background:#fbe5e2}
  .fb{margin-top:10px;padding:10px 12px;border-radius:6px;font-size:14.5px;line-height:1.5}
  .fb.best{background:#e3f4ea}.fb.ok{background:#fbf1d6}.fb.bad{background:#fbe5e2}
  pre{font-family:Consolas,monospace;font-size:13.5px;background:#1e2a23;color:#cfe8d6;border-radius:6px;padding:10px 12px;overflow:auto;margin:8px 0}
  .row{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:12px}
  .btn{font:inherit;font-size:14px;padding:8px 14px;border-radius:5px;border:1px solid var(--line);background:#fff;cursor:pointer}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  .btn:disabled{opacity:.5;cursor:default}
  input[type=text]{width:100%;font:inherit;padding:9px 11px;border-radius:5px;border:1px solid var(--line)}
  table.res{width:100%;border-collapse:collapse;font-size:14.5px;margin:8px 0}
  table.res td{padding:6px 4px;border-bottom:1px solid var(--line)}
  table.res td:last-child{text-align:right;font-weight:600}
  .code{font-family:Consolas,monospace;font-size:19px;border:1px dashed var(--acc);border-radius:6px;padding:6px 12px;display:inline-block;background:#e6f3eb}
  .muted{color:var(--muted)}
  @media (max-width:700px){.anon{grid-template-columns:1fr 1fr}}
  @media print{.bar,.ribbon,.row{display:none}}
</style>
</head>
<body>
<div class="bar"><b>🗃 Адміністратор бази учнів</b><span class="db">lyceum7.db › students</span><span class="sc" id="sc"></span></div>
<div class="ribbon" id="rib"></div>
<div class="wrap" id="main"></div>

<script>
/* ===== Код результату для вчителя (однаковий в усіх іграх комплекту) =====
   Формат: ГРА-БАЛИ-ДДММ-КОНТРОЛЬ. Контрольна частина залежить від гри, балів,
   дати та повного імені учня. Перевірка — сторінка «Перевірка результатів». */
function normName(n){ return String(n||'').toLowerCase().replace(/[’ʼ`´]/g,"'").replace(/\s+/g,' ').trim(); }
function codeSig(g,score,dm,name){
  const s=[g,score,dm,normName(name),'kiberihry-2026'].join('|');
  let h=2166136261>>>0; for(const ch of s){ h^=ch.codePointAt(0); h=Math.imul(h,16777619)>>>0; }
  const A='23456789ABCDEFGHJKMNPQRSTUVWXYZ'; let r=''; for(let i=0;i<4;i++){ r+=A[h%31]; h=Math.floor(h/31); } return r;
}
/* Обов'язкове ім'я учня: без нього код результату неможливо перевірити */
function requireName(){
  const inp=document.getElementById('pname'); if(!inp) return null;
  const v=(inp.value||'').replace(/\s+/g,' ').trim();
  let msg=document.getElementById('pnameErr');
  if(!msg){ msg=document.createElement('div'); msg.id='pnameErr'; msg.setAttribute('role','alert');
    msg.style.cssText='color:#e5484d;font-size:13px;font-weight:600;margin-top:6px;font-family:inherit';
    (inp.closest('label')||inp).insertAdjacentElement('afterend',msg);
    inp.addEventListener('input',()=>{ msg.textContent=''; inp.style.outline=''; }); }
  if(!/\p{L}.*\p{L}/u.test(v) || v.length<3){
    msg.textContent='⚠ Введи своє ім’я та клас — без цього вчитель не зможе перевірити твій результат.';
    inp.style.outline='2px solid #e5484d'; inp.focus(); return null; }
  msg.textContent=''; inp.style.outline=''; return v;
}
function makeCode(g,score,name){
  const d=new Date(), dm=String(d.getDate()).padStart(2,'0')+String(d.getMonth()+1).padStart(2,'0');
  return g+'-'+score+'-'+dm+'-'+codeSig(g,score,dm,name);
}

/* =====================================================================
   НАЛАШТУВАННЯ — учитель може змінювати таблицю, завдання й пояснення.
   Теми: «Обробка табличної інформації», «Робота з базами даних» (Теми 8.2–8.3).
   Усі учні та дані вигадані.
   ===================================================================== */
const COLS = ['ПІБ','Клас','Дата народження','Адреса','Телефон батьків','Свідоцтво про народження','Середній бал','Група здоров’я'];
const ROWS = [
 ['Бондар Ірина','10-А','14.03.2010','вул. Квіткова, 12','+380 67 111 22 33','I-ЛВ 123456','10,4','основна'],
 ['Гнатюк Максим','10-А','02.07.2009','вул. Шкільна, 5, кв. 3','+380 50 222 33 44','I-ЛВ 234567','8,7','підготовча'],
 ['Дмитренко Софія','10-Б','29.11.2009','вул. Лісова, 41','+380 63 333 44 55','I-ЛВ 345678','11,2','основна'],
 ['Коваль Назар','10-Б','17.01.2010','вул. Миру, 8','+380 97 444 55 66','I-ЛВ 456789','7,9','спеціальна'],
 ['Литвин Олена','11-А','05.05.2009','вул. Садова, 3','+380 66 555 66 77','I-ЛВ 567890','9,6','основна']
];
/* Етап 1: які стовпці потрібні бібліотеці (need:true) */
const LIB_NEED = ['ПІБ','Клас'];
/* Етап 2: публікація результатів анонімного опитування */
const SURVEY = { cols:['ПІБ','Клас','Вік','Відповідь'],
  rows:[['Бондар Ірина','10-А','16','Онлайн-ігри допомагають запам’ятати'],['Гнатюк Максим','10-А','17','Хочу більше симуляторів'],['Коваль Назар','10-Б','16','Не вистачає часу на уроці'],['Литвин Олена','11-А','17','Сподобався квест']],
  opts:['Залишити','Узагальнити','Видалити'],
  grade:{ 'ПІБ':['bad','bad','best'], 'Клас':['ok','best','ok'], 'Вік':['ok','best','ok'], 'Відповідь':['best','bad','bad'] },
  gen:{ 'Клас':v=>v.slice(0,2)+' клас', 'Вік':v=>'16–17 років', 'ПІБ':v=>'Учень', 'Відповідь':v=>'(відповідь)' },
  why:{ 'ПІБ':'Імена в оприлюдненій таблиці роблять «анонімне» опитування зовсім не анонімним — їх треба видалити.',
        'Клас':'Конкретний клас разом з іншими даними допомагає вгадати, хто відповідав. Достатньо узагальнити до паралелі (10 клас).',
        'Вік':'Точний вік — ще одна «підказка» для впізнавання. Достатньо діапазону.',
        'Відповідь':'Відповіді — мета опитування, їх залишаємо без змін.' } };
const QUIZ = [
 {stage:'SQL-запит', task:'Класна керівниця 10-А просить список свого класу з телефонами батьків для екскурсії. Який запит виконати?', code:true,
  choices:[
   {t:'SELECT * FROM students;', kind:'bad', why:'Зірочка повертає всі стовпці всіх учнів ліцею, зокрема дані свідоцтв і групу здоров’я. Це набагато більше, ніж потрібно.'},
   {t:"SELECT ПІБ, Телефон_батьків FROM students WHERE Клас = '10-А';", kind:'best', why:'Лише потрібні стовпці (SELECT) і лише потрібні рядки (WHERE). Це принцип мінімізації даних, записаний мовою SQL.'},
   {t:"SELECT * FROM students WHERE Клас = '10-А';", kind:'ok', why:'Рядки відфільтровано правильно, але стовпців забагато: свідоцтва й адреси для екскурсії не потрібні.'}]},
 {stage:'Безпечний код', task:'Учні пишуть програму входу для шкільного сайту. Який спосіб передачі логіна в запит до бази безпечний?', code:true,
  choices:[
   {t:'query = "SELECT * FROM users WHERE login = \'" + login + "\'"\ncursor.execute(query)', kind:'bad', why:'Текст, введений користувачем, вклеюється прямо в SQL. Спеціально складений «логін» змінить сам запит — це SQL-ін’єкція, одна з найпоширеніших вразливостей сайтів.'},
   {t:'cursor.execute("SELECT * FROM users WHERE login = ?", (login,))', kind:'best', why:'Параметризований запит: база отримує логін окремо від коду запиту, тому введений текст завжди залишається лише даними.'},
   {t:'query = f"SELECT * FROM users WHERE login = \'{login}\'"\ncursor.execute(query)', kind:'bad', why:'f-рядок — та сама склейка тексту, лише коротше записана. Вразливість залишається.'}]},
 {stage:'Експорт даних', task:'Учитель просить скопіювати всю базу учнів на флешку, щоб попрацювати вдома над звітом про успішність.',
  choices:[
   {t:'Скопіювати файл бази повністю — учителю можна довіряти', kind:'bad', why:'Довіра тут ні до чого: флешку можна загубити, а в базі — адреси, телефони й дані документів усіх учнів.'},
   {t:'Вивантажити лише потрібні для звіту стовпці (клас і середній бал), без імен, і зберегти в зашифрований архів', kind:'best', why:'Для звіту про успішність досить знеособлених даних, а шифрування захистить їх, якщо флешку загублять.'},
   {t:'Скопіювати лише стовпці ПІБ, клас і середній бал', kind:'ok', why:'Уже значно менше даних, але імена для статистичного звіту не потрібні, і файл ніяк не захищено.'}]}
];

/* ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STAGES = ['Мінімізація','Знеособлення',...QUIZ.map(q=>q.stage)];
let S;
function fresh(){ return {player:'',st:-1,pts:[],t0:Date.now()}; }
const MAXST = [COLS.length*10, SURVEY.cols.length*10, 20,20,20];
function head(){
  $('rib').innerHTML=STAGES.map((n,k)=>`<span class="${k===S.st?'on':''}">${k+1}. ${n}${S.pts[k]!=null?' ✔':''}</span>`).join('');
  const t=S.pts.reduce((s,x)=>s+(x||0),0); $('sc').textContent=S.player?`${S.player} · ${t} балів`:'';
}
function grid(cols,rows,off,chg){
  return `<div class="tbl"><table class="g"><tr><th class="rn"></th>${cols.map((c,k)=>`<th class="${off&&off[k]?'off':''}">${esc(c)}</th>`).join('')}</tr>${rows.map((r,i)=>`<tr><td class="rn">${i+1}</td>${r.map((v,k)=>`<td class="${off&&off[k]?'off':''} ${chg&&chg[k]?'chg':''}">${esc(v)}</td>`).join('')}</tr>`).join('')}</table></div>`;
}

function start(){
  S=fresh(); head();
  $('main').innerHTML=`<div class="card"><h1>Адміністратор бази учнів</h1>
   <p>Ти проходиш практику в ліцеї й допомагаєш адмініструвати базу даних учнів. До тебе звертатимуться з різними запитами. Твоє завдання — щоразу видавати <b>лише ті дані, які справді потрібні</b>, і не залишати лазівок для витоку.</p>
   ${grid(COLS,ROWS)}
   <p class="muted">Так виглядає таблиця <code>students</code>. Усі дані вигадані.</p>
   <label>Твоє ім’я та клас:<br><input type="text" id="pname" maxlength="40" placeholder="Напр.: Тарас В., 11-Б"></label>
   <div class="row"><button class="btn primary" id="go">Почати практику →</button></div></div>`;
  $('go').onclick=()=>{ { const _n=requireName(); if(!_n) return; S.player=_n; } S.t0=Date.now(); S.st=0; stage(); };
}
function stage(){ head(); [st1,st2,quiz,quiz,quiz][S.st]?.(); if(S.st>=STAGES.length) finish(); window.scrollTo({top:0,behavior:'smooth'}); }
function nextBtn(){ return `<div class="row"><button class="btn primary" id="nx">${S.st+1<STAGES.length?'Далі →':'Підсумок →'}</button></div>`; }
function bindNx(){ $('nx').onclick=()=>{ S.st++; stage(); }; }

function st1(){
  const on=COLS.map(()=>true);
  const draw=()=>{ $('pv').innerHTML=grid(COLS,ROWS,on.map(x=>!x)); };
  $('main').innerHTML=`<div class="card"><h1>1. Мінімізація даних</h1>
   <div class="task">📚 <b>Бібліотека:</b> «Нам потрібен список учнів для видачі підручників. Вивантаж, будь ласка, таблицю».</div>
   <p>Зніми позначки зі стовпців, які бібліотеці <b>не потрібні</b>. Попередній перегляд експорту оновлюється одразу.</p>
   <div class="cols" id="cols">${COLS.map((c,k)=>`<label data-k="${k}"><input type="checkbox" checked data-k="${k}"> ${esc(c)}</label>`).join('')}</div>
   <div id="pv"></div><div class="row" id="act"><button class="btn primary" id="ex">Експортувати</button></div><div id="fb"></div></div>`;
  document.querySelectorAll('#cols input').forEach(c=>c.onchange=()=>{ on[+c.dataset.k]=c.checked; draw(); });
  draw();
  $('ex').onclick=()=>{
    let p=0; const bad=[];
    document.querySelectorAll('#cols label').forEach(l=>{ const k=+l.dataset.k, need=LIB_NEED.includes(COLS[k]), good=on[k]===need; if(good)p+=10; else bad.push(COLS[k]); l.classList.add(good?'g':'w'); l.querySelector('input').disabled=true; });
    S.pts[0]=p; head(); $('act').remove();
    $('fb').innerHTML=`<div class="fb ${p===MAXST[0]?'best':p>=50?'ok':'bad'}"><b>${p===MAXST[0]?'✔ Ідеальний експорт.':'Є помилки.'}</b> Бібліотеці для видачі підручників досить <b>ПІБ і класу</b>. Дата народження, адреса, телефони, документи, оцінки та здоров’я до підручників не мають стосунку — це принцип <b>мінімізації даних</b>.${bad.length?`<br>Неправильно: ${bad.map(esc).join(', ')}.`:''}<br><span class="muted">+${p} з ${MAXST[0]}</span></div>${nextBtn()}`;
    bindNx();
  };
}

function st2(){
  const pick={}; SURVEY.cols.forEach(c=>pick[c]=0);
  const draw=()=>{
    const off=SURVEY.cols.map(c=>pick[c]===2), chg=SURVEY.cols.map(c=>pick[c]===1);
    const rows=SURVEY.rows.map(r=>r.map((v,k)=>{ const c=SURVEY.cols[k]; return pick[c]===1?SURVEY.gen[c](v):v; }));
    $('pv').innerHTML=grid(SURVEY.cols,rows,off,chg);
  };
  $('main').innerHTML=`<div class="card"><h1>2. Знеособлення</h1>
   <div class="task">🌐 <b>Заступник директора:</b> «Опублікуй на сайті ліцею результати анонімного опитування учнів про онлайн-ігри».</div>
   <p>Але в таблиці з відповідями чомусь залишилися імена… Для кожного стовпця обери дію: <b>залишити</b>, <b>узагальнити</b> (менш точне значення) чи <b>видалити</b>.</p>
   <div class="anon" id="an">${SURVEY.cols.map(c=>`<div data-c="${esc(c)}"><b>${esc(c)}</b><select data-c="${esc(c)}">${SURVEY.opts.map((o,k)=>`<option value="${k}">${o}</option>`).join('')}</select></div>`).join('')}</div>
   <div id="pv"></div><div class="row" id="act"><button class="btn primary" id="pub">Опублікувати</button></div><div id="fb"></div></div>`;
  document.querySelectorAll('#an select').forEach(s=>s.onchange=()=>{ pick[s.dataset.c]=+s.value; draw(); });
  draw();
  $('pub').onclick=()=>{
    let p=0; const notes=[];
    document.querySelectorAll('#an > div').forEach(d=>{ const c=d.dataset.c, g=SURVEY.grade[c][pick[c]]; p+=g==='best'?10:g==='ok'?5:0; d.classList.add(g==='best'?'g':g==='ok'?'m':'w'); d.querySelector('select').disabled=true;
      notes.push(`<b>${esc(c)}</b> — ${g==='best'?'✔':g==='ok'?'≈':'✘'} ${esc(SURVEY.why[c])}`); });
    S.pts[1]=p; head(); $('act').remove();
    $('fb').innerHTML=`<div class="fb ${p===MAXST[1]?'best':p>=25?'ok':'bad'}">${notes.join('<br>')}<br><span class="muted">+${p} з ${MAXST[1]}</span></div>${nextBtn()}`;
    bindNx();
  };
}

function quiz(){
  const q=QUIZ[S.st-2];
  $('main').innerHTML=`<div class="card"><h1>${S.st+1}. ${esc(q.stage)}</h1><div class="task">${esc(q.task)}</div><div id="ch"></div><div id="fb"></div></div>`;
  q.choices.map((c,k)=>k).sort(()=>Math.random()-.5).forEach(k=>{
    const c=q.choices[k], b=document.createElement('button'); b.className='choice'+(q.code?' code':''); b.textContent=c.t;
    b.onclick=()=>{ document.querySelectorAll('.choice').forEach(x=>x.disabled=true); b.classList.add('picked',c.kind);
      const p=c.kind==='best'?20:c.kind==='ok'?10:0; S.pts[S.st]=p; head();
      const best=q.choices.find(x=>x.kind==='best');
      $('fb').innerHTML=`<div class="fb ${c.kind}"><b>${c.kind==='best'?'✔ Правильно.':c.kind==='ok'?'≈ Частково.':'✘ Небезпечно.'}</b> ${esc(c.why)}${c.kind!=='best'?(q.code?`<pre>${esc(best.t)}</pre>`:`<br><b>Краще:</b> ${esc(best.t)}.`):''}<br><span class="muted">+${p} з 20</span></div>${nextBtn()}`;
      bindNx(); };
    $('ch').appendChild(b);
  });
}

function finish(){
  head();
  const score=S.pts.reduce((s,x)=>s+(x||0),0), max=MAXST.reduce((a,b)=>a+b,0), pct=Math.round(score/max*100);
  const chk=(score*43+S.player.length*29+S.pts.length)%97, code=makeCode('АБ',score,S.player);
  const secs=Math.floor((Date.now()-S.t0)/1000), date=new Date().toLocaleString('uk-UA',{dateStyle:'medium',timeStyle:'short'});
  const summary=`Адміністратор бази учнів — ${S.player}, ${date}\n${STAGES.map((n,k)=>`${n}: ${S.pts[k]||0}/${MAXST[k]}`).join('; ')}\nБали: ${score} з ${max} (${pct}%); код: ${code}\nУчень: ${S.player}\nКод: ${code}`;
  $('main').innerHTML=`<div class="card"><h1>${pct>=85?'🏅 Надійний адміністратор БД':pct>=60?'👍 Добрий результат':'⚠️ Даним учнів загрожує витік'}</h1>
   <p><b>${esc(S.player)}</b> · ${date}</p>
   <table class="res">${STAGES.map((n,k)=>`<tr><td>${k+1}. ${n}</td><td>${S.pts[k]||0} з ${MAXST[k]}</td></tr>`).join('')}
    <tr><td>Час</td><td>${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</td></tr><tr><td><b>Рахунок</b></td><td>${score} з ${max} (${pct}%)</td></tr></table>
   <p>Код результату для вчителя: <span class="code">${code}</span></p>
   <p style="line-height:1.6">✂ Мінімізація: лише потрібні стовпці й рядки (SELECT + WHERE) · 🎭 Знеособлення: прибери імена, узагальни точні значення · 🧱 Параметризовані запити замість склеювання рядків · 🔐 Експорт — мінімум даних і шифрування · 🏥 Здоров’я й документи — найчутливіші дані в базі.</p>
   <div class="row"><button class="btn" id="copy">📋 Копіювати результат</button><button class="btn" id="prn">🖨 Друк / PDF</button><button class="btn primary" id="again">Ще раз</button></div></div>`;
  $('copy').onclick=e=>{const b=e.target;try{navigator.clipboard.writeText(summary).then(()=>b.textContent='✅ Скопійовано',()=>b.textContent='Не вдалося скопіювати');}catch(err){b.textContent='Не вдалося скопіювати';}};
  $('prn').onclick=()=>{try{window.print();}catch(e){}};
  $('again').onclick=start;
}

start();
</script>
</body>
</html>
