<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поштова скринька — симулятор розпізнавання фішингу</title>
<style>
  :root{ --bg:#f4f6f8; --side:#ffffff; --line:#e1e6ec; --text:#1f2933; --muted:#6b7785; --acc:#d93f2b; --acc2:#f26b3a; --sel:#fff1ec; --ok:#1d9b5f; --bad:#d93f2b; --mid:#d29a00; }
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
  .top{height:56px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line)}
  .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;color:var(--acc)}
  .logo i{font-style:normal;width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:flex;align-items:center;justify-content:center}
  .search{flex:1;max-width:520px;background:#eef1f4;border-radius:20px;padding:8px 14px;color:var(--muted);font-size:14px}
  .score{margin-left:auto;font-size:14px;color:var(--muted)}
  .app{flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0}
  .list{background:var(--side);border-right:1px solid var(--line);overflow:auto}
  .lh{padding:12px 14px;font-weight:600;font-size:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
  .it{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
  .it:hover{background:#f8f9fb}
  .it.cur{background:var(--sel);box-shadow:inset 3px 0 0 var(--acc)}
  .it.unread .fr,.it.unread .sj{font-weight:700}
  .it .fr{font-size:14px;display:flex;justify-content:space-between;gap:6px}
  .it .fr span:last-child{font-size:12px;color:var(--muted);font-weight:400}
  .it .sj{font-size:13.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it .pv{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it .tag{position:absolute;right:12px;bottom:10px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
  .tag.good{background:#dff3e9;color:var(--ok)}.tag.bad{background:#fde3df;color:var(--bad)}
  .read{overflow:auto;padding:20px 26px;position:relative}
  .read h1{font-size:21px;margin:0 0 12px;font-weight:600}
  .meta{display:flex;gap:12px;align-items:center;margin-bottom:14px}
  .av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
  .meta .nm{font-weight:600}.meta .em{font-size:13px;color:var(--muted)}
  .meta .dt{margin-left:auto;font-size:13px;color:var(--muted)}
  .body{font-size:15px;line-height:1.65;background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .body a{color:#1a5fd0;cursor:pointer;text-decoration:underline}
  .att{display:inline-flex;align-items:center;gap:8px;margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#fafbfc;font-size:14px}
  .status{position:fixed;left:0;bottom:0;background:#2c3440;color:#fff;font-size:12.5px;padding:4px 10px;border-radius:0 6px 0 0;font-family:Consolas,monospace;display:none;z-index:5}
  .verdict{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .verdict h3{margin:0 0 8px;font-size:15px}
  .vb{display:flex;gap:8px;flex-wrap:wrap}
  .btn{font:inherit;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
  .btn.sel{border-color:var(--acc);background:var(--sel);font-weight:600}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  .btn:disabled{opacity:.5;cursor:default}
  .signs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
  .signs label{font-size:13.5px;display:flex;gap:7px;align-items:flex-start;padding:6px 8px;border:1px solid var(--line);border-radius:7px;cursor:pointer}
  .signs label.g{border-color:var(--ok);background:#e8f6ef}.signs label.w{border-color:var(--bad);background:#fdecea}.signs label.m{border-color:var(--mid);background:#fdf5dc}
  .fb{margin-top:12px;padding:11px 13px;border-radius:9px;font-size:14.5px;line-height:1.5}
  .fb.good{background:#e3f5ec}.fb.bad{background:#fde7e3}
  .row{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;flex-wrap:wrap}
  input[type=text]{width:100%;font:inherit;padding:9px 11px;border-radius:8px;border:1px solid var(--line)}
  table.res{width:100%;border-collapse:collapse;font-size:14.5px;margin:8px 0}
  table.res td{padding:6px 4px;border-bottom:1px solid var(--line)}
  table.res td:last-child{text-align:right;font-weight:600}
  .code{font-family:Consolas,monospace;font-size:19px;border:1px dashed var(--acc);border-radius:8px;padding:6px 12px;display:inline-block;background:var(--sel)}
  .muted{color:var(--muted)}
  @media (max-width:820px){body{height:auto}.app{grid-template-columns:1fr}.list{max-height:260px}.signs{grid-template-columns:1fr}}
  @media print{.top,.list,.row{display:none}.app{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><div class="logo"><i>✉</i>ЛіцейПошта</div><div class="search">🔍 Пошук у пошті</div><div class="score" id="score"></div></div>
<div class="app"><div class="list" id="list"></div><div class="read" id="read"></div></div>
<div class="status" id="status"></div>

<script>
/* ===== Код результату для вчителя (однаковий в усіх іграх комплекту) =====
   Формат: ГРА-БАЛИ-ДДММ-КОНТРОЛЬ. Контрольна частина залежить від гри, балів,
   дати та повного імені учня. Перевірка — сторінка «Перевірка результатів». */
function normName(n){ return String(n||'').toLowerCase().replace(/[’ʼ`´]/g,"'").replace(/\s+/g,' ').trim(); }
function codeSig(g,score,dm,name){
  const s=[g,score,dm,normName(name),'kiberihry-2026'].join('|');
  let h=2166136261>>>0; for(const ch of s){ h^=ch.codePointAt(0); h=Math.imul(h,16777619)>>>0; }
  const A='23456789ABCDEFGHJKMNPQRSTUVWXYZ'; let r=''; for(let i=0;i<4;i++){ r+=A[h%31]; h=Math.floor(h/31); } return r;
}
function makeCode(g,score,name){
  const d=new Date(), dm=String(d.getDate()).padStart(2,'0')+String(d.getMonth()+1).padStart(2,'0');
  return g+'-'+score+'-'+dm+'-'+codeSig(g,score,dm,name);
}

/* =====================================================================
   НАЛАШТУВАННЯ — учитель може змінювати листи, ознаки й пояснення.
   Тема: «Налагодження та використання електронної пошти» (Тема 6.4).
   phish:true — фішинговий лист; signs — його справжні ознаки (ключі з SIGNS).
   Посилання: text — що видно в листі, href — куди воно веде насправді.
   Усі адреси, організації й люди вигадані; посилання в грі не відкриваються.
   ===================================================================== */
const SIGNS = {
  from:'Підозрілий відправник (домен, адреса)',
  link:'Посилання веде не туди, куди обіцяє',
  rush:'Тиск, терміновість, погрози',
  att:'Небезпечне вкладення',
  ask:'Прохання про гроші, коди, паролі чи дані',
  prize:'Занадто гарно, щоб бути правдою'
};
const MAILS = [
 {fromName:'Олена Петрівна', from:'o.petrivna@lyceum7.edu.ua', col:'#3f7ee8', time:'08:05', subj:'Практична робота №3',
  body:'Доброго ранку! Надсилаю умову практичної роботи №3 до завтрашнього уроку. Виконайте, будь ласка, завдання 1–4.<br><br>З повагою,<br>Олена Петрівна', att:'Практична_3.docx',
  phish:false, why:'Відправник зі шкільного домену, лист очікуваний, вкладення — звичайний документ. Але все одно варто зберігати пильність.'},
 {fromName:'Служба безпеки акаунта', from:'security@acc0unt-verify-support.com', col:'#6b7785', time:'07:42', subj:'⚠ Ваш акаунт буде видалено через 24 години',
  body:'Ми виявили підозрілу активність. Якщо ви не підтвердите особу протягом 24 годин, акаунт буде <b>назавжди видалено</b>.<br><br>Підтвердити: <a data-href="http://acc0unt-verify-support.com/login.php">https://lyceum7.edu.ua/account</a>',
  phish:true, signs:['from','link','rush'], why:'Домен відправника з «0» замість «o», погроза видалення за 24 години, а посилання показує шкільну адресу, але веде на зовсім інший сайт.'},
 {fromName:'Доставка Посилок', from:'info@posylka-delivery.top', col:'#f29b38', time:'Вчора', subj:'Посилку затримано на складі',
  body:'Ваша посилка не може бути доставлена через неповну адресу. Сплатіть 19 грн за повторну доставку, інакше її буде повернуто відправнику.<br><br><a data-href="http://posylka-delivery.top/pay?card=">Оплатити доставку</a>',
  phish:true, signs:['from','link','ask','rush'], why:'Ти нічого не замовляв, а лист вимагає ввести дані картки на незнайомому сайті. Маленька сума — частий прийом, щоб людина не замислювалась.'},
 {fromName:'Андрій Іванович', from:'a.ivanovych@lyceum7.edu.ua', col:'#2c9b6a', time:'Вчора', subj:'Екскурсія в п’ятницю',
  body:'Нагадую: у п’ятницю о 9:00 збираємося біля ліцею. Візьміть із собою воду та зручне взуття. Повернення орієнтовно о 15:00.',
  phish:false, why:'Звичайне інформаційне повідомлення від класного керівника зі шкільної адреси, без посилань і прохань.'},
 {fromName:'Директор ліцею', from:'director.lyceum7@gmail.com', col:'#7b4fd6', time:'Вчора', subj:'Термінове прохання',
  body:'Ти зараз на зв’язку? Мені терміново потрібна допомога. Купи, будь ласка, 5 подарункових карток по 500 грн і надішли мені фото кодів. Гроші поверну сьогодні. Нікому не кажи, це сюрприз для вчителів.',
  phish:true, signs:['from','ask','rush'], why:'Директор не пише учням з особистої пошти й не просить купувати подарункові картки. Секретність і поспіх — класичні ознаки шахрайства від імені керівника.'},
 {fromName:'Розклад уроків', from:'rozklad@lyceum7-edu.com', col:'#e0533d', time:'Пн', subj:'Новий розклад на ІІ семестр',
  body:'Доброго дня! У вкладенні — оновлений розклад уроків. Відкрийте файл, щоб переглянути зміни.', att:'Rozklad_2026.pdf.exe',
  phish:true, signs:['from','att'], why:'Домен «lyceum7-edu.com» лише схожий на шкільний (lyceum7.edu.ua). А «.pdf.exe» — це програма, замаскована під документ.'},
 {fromName:'ЛіцейПошта', from:'noreply@lyceum7.edu.ua', col:'#d93f2b', time:'Пн', subj:'Скидання пароля',
  body:'<i class="muted">(Ти щойно сам натиснув «Забули пароль?» на сайті ліцею.)</i><br><br>Щоб задати новий пароль, перейдіть за посиланням протягом 30 хвилин:<br><a data-href="https://lyceum7.edu.ua/reset?t=8f2c1">https://lyceum7.edu.ua/reset</a><br><br>Якщо ви не запитували скидання — просто проігноруйте цей лист.',
  phish:false, why:'Ти сам запросив скидання, лист прийшов з офіційного домену, а посилання веде туди, куди обіцяє. Обмеження в 30 хвилин тут — захисний механізм, а не тиск.'},
 {fromName:'Лотерея Щастя', from:'winner@mega-prize-ua.xyz', col:'#e6b800', time:'Нд', subj:'🎉 Вітаємо! Ви виграли смартфон!',
  body:'Ваша адреса стала переможцем щомісячного розіграшу! Щоб отримати приз, заповніть анкету: ПІБ, адреса, номер телефону і дані картки для оплати доставки.<br><br><a data-href="http://mega-prize-ua.xyz/form">Отримати приз</a>',
  phish:true, signs:['from','link','ask','prize'], why:'Ти не брав участі в розіграші. «Безкоштовний» приз, за доставку якого треба ввести дані картки, — класичне шахрайство.'}
];

/* ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S;
function fresh(){ return {player:'',cur:-1,res:{},t0:Date.now()}; }
const pts = r => r ? r.pts : 0;
const MAXP = m => 10 + (m.phish ? m.signs.length*2 : 0);

function list(){
  const done=Object.keys(S.res).length;
  $('list').innerHTML=`<div class="lh"><span>📥 Вхідні</span><span class="muted">${done}/${MAILS.length} перевірено</span></div>`+
   MAILS.map((m,k)=>{ const r=S.res[k]; return `<div class="it ${k===S.cur?'cur':''} ${r?'':'unread'}" data-k="${k}"><div class="fr"><span>${esc(m.fromName)}</span><span>${m.time}</span></div><div class="sj">${esc(m.subj)}</div><div class="pv">${esc(m.body.replace(/<[^>]+>/g,' ').slice(0,70))}</div>${r?`<span class="tag ${r.correct?'good':'bad'}">${r.correct?'✔':'✘'}</span>`:''}</div>`; }).join('');
  document.querySelectorAll('.it').forEach(el=>el.onclick=()=>{ S.cur=+el.dataset.k; open(); });
  const total=Object.values(S.res).reduce((s,r)=>s+r.pts,0);
  $('score').textContent = S.player ? `${S.player} · ${total} балів` : '';
}

function start(){
  S=fresh(); list();
  $('read').innerHTML=`<h1>Ласкаво просимо до ЛіцейПошти 👋</h1>
   <div class="body">У твоїй скриньці <b>${MAILS.length} листів</b>. Частина з них справжні, частина — фішингові. Відкривай кожен лист і вирішуй: <b>безпечний</b> він чи <b>фішинг</b>. Якщо фішинг — познач усі його ознаки.<br><br>
   💡 <b>Наведи курсор на посилання</b> (не клацай!) — унизу екрана з’явиться адреса, куди воно веде насправді. Так роблять і в справжній пошті.<br><br>
   <label>Твоє ім’я та клас:<br><input type="text" id="pname" maxlength="40" placeholder="Напр.: Катерина Б., 11-А"></label>
   <div class="row"><button class="btn primary" id="go">Відкрити пошту</button></div></div>`;
  $('go').onclick=()=>{ S.player=($('pname').value||'').trim()||'Гравець'; S.t0=Date.now(); S.cur=0; open(); };
}

function open(){
  if(!S.player){ S.player='Гравець'; S.t0=Date.now(); }
  list();
  const m=MAILS[S.cur], r=S.res[S.cur];
  const ini=m.fromName.split(' ').map(w=>w[0]).join('').slice(0,2);
  $('read').innerHTML=`<h1>${esc(m.subj)}</h1>
   <div class="meta"><div class="av" style="background:${m.col}">${esc(ini)}</div><div><div class="nm">${esc(m.fromName)}</div><div class="em">&lt;${esc(m.from)}&gt; · кому: мені</div></div><div class="dt">${m.time}</div></div>
   <div class="body">${m.body}${m.att?`<div><span class="att">📎 ${esc(m.att)}</span></div>`:''}</div>
   <div class="verdict"><h3>Твій висновок</h3>
     <div class="vb"><button class="btn" data-v="0">✔ Безпечний лист</button><button class="btn" data-v="1">🎣 Фішинг</button></div>
     <div id="sg"></div><div id="act"></div><div id="fb"></div></div>`;
  document.querySelectorAll('.body a').forEach(a=>{
    a.onmouseenter=()=>{ $('status').textContent=a.dataset.href; $('status').style.display='block'; };
    a.onmouseleave=()=>{ $('status').style.display='none'; };
    a.onclick=e=>{ e.preventDefault(); alert('У навчальній грі посилання не відкриваються. Наведи курсор, щоб побачити справжню адресу.'); };
  });
  const sel={v:null,signs:new Set()};
  const draw=()=>{
    document.querySelectorAll('.vb .btn').forEach(b=>b.classList.toggle('sel',+b.dataset.v===sel.v));
    $('sg').innerHTML = sel.v===1 ? `<div class="muted" style="font-size:13px;margin-top:10px">Познач ознаки фішингу, які ти помітив:</div><div class="signs">${Object.keys(SIGNS).map(k=>`<label><input type="checkbox" data-k="${k}" ${sel.signs.has(k)?'checked':''}> ${SIGNS[k]}</label>`).join('')}</div>` : '';
    document.querySelectorAll('.signs input').forEach(c=>c.onchange=()=>{ c.checked?sel.signs.add(c.dataset.k):sel.signs.delete(c.dataset.k); });
    $('act').innerHTML = sel.v!==null ? `<div class="row"><button class="btn primary" id="send">Підтвердити</button></div>` : '';
    if($('send')) $('send').onclick=submit;
  };
  const submit=()=>{
    const isPh=sel.v===1, correct=isPh===m.phish; let p=correct?10:0, hit=[], miss=[], extra=[];
    if(m.phish && isPh){ hit=m.signs.filter(s=>sel.signs.has(s)); miss=m.signs.filter(s=>!sel.signs.has(s)); extra=[...sel.signs].filter(s=>!m.signs.includes(s)); p+=Math.max(0,hit.length*2-extra.length); }
    S.res[S.cur]={correct,pts:p,v:sel.v,signs:[...sel.signs],hit,miss,extra};
    render();
  };
  const render=()=>{
    const r=S.res[S.cur];
    document.querySelectorAll('.vb .btn').forEach(b=>{ b.disabled=true; b.classList.toggle('sel',+b.dataset.v===r.v); });
    if(m.phish && r.v===1){
      $('sg').innerHTML=`<div class="signs">${Object.keys(SIGNS).map(k=>{ const real=m.signs.includes(k), ch=r.signs.includes(k); const cls=real&&ch?'g':real?'m':ch?'w':''; return `<label class="${cls}"><input type="checkbox" disabled ${ch?'checked':''}> ${SIGNS[k]}${real&&!ch?' — пропущено':''}</label>`; }).join('')}</div>`;
    } else $('sg').innerHTML='';
    $('act').innerHTML='';
    const head = r.correct ? (m.phish?'✔ Так, це фішинг!':'✔ Так, лист безпечний.') : (m.phish?'✘ Це був фішинг!':'✘ Насправді лист безпечний.');
    const next = MAILS.findIndex((x,k)=>!S.res[k]);
    $('fb').innerHTML=`<div class="fb ${r.correct?'good':'bad'}"><b>${head}</b> ${esc(m.why)}${m.phish?`<br><b>Ознаки:</b> ${m.signs.map(s=>SIGNS[s]).join('; ')}.`:''}<br><span class="muted">+${r.pts} з ${MAXP(m)} балів</span></div>
      <div class="row">${next>=0?`<button class="btn primary" id="nx">Наступний лист →</button>`:`<button class="btn primary" id="fin">Підсумок →</button>`}</div>`;
    list();
    if($('nx')) $('nx').onclick=()=>{ S.cur=next; open(); };
    if($('fin')) $('fin').onclick=finish;
  };
  document.querySelectorAll('.vb .btn').forEach(b=>b.onclick=()=>{ sel.v=+b.dataset.v; draw(); });
  if(r) render();
}

function finish(){
  S.cur=-1; list();
  const total=Object.values(S.res).reduce((s,r)=>s+r.pts,0), max=MAILS.reduce((s,m)=>s+MAXP(m),0), pct=Math.round(total/max*100);
  const corr=Object.values(S.res).filter(r=>r.correct).length;
  const missed=MAILS.filter((m,k)=>m.phish&&!S.res[k].correct).length, falseAl=MAILS.filter((m,k)=>!m.phish&&!S.res[k].correct).length;
  const chk=(total*41+S.player.length*23+corr)%97, code=makeCode('ПС',total,S.player);
  const secs=Math.floor((Date.now()-S.t0)/1000), date=new Date().toLocaleString('uk-UA',{dateStyle:'medium',timeStyle:'short'});
  const summary=`Поштова скринька — ${S.player}, ${date}\nПравильних висновків: ${corr}/${MAILS.length}; пропущено фішингу: ${missed}; хибних тривог: ${falseAl}\nБали: ${total} з ${max} (${pct}%); код: ${code}\nУчень: ${S.player}\nКод: ${code}`;
  $('read').innerHTML=`<h1>${pct>=85?'🛡 Фішинг не пройде!':pct>=60?'👍 Добре, але будь уважнішим':'🎣 Тебе легко «зловити на гачок»'}</h1>
   <div class="body"><b>${esc(S.player)}</b> · ${date}
   <table class="res"><tr><td>Правильних висновків</td><td>${corr} з ${MAILS.length}</td></tr><tr><td>Пропущено фішингових листів</td><td>${missed}</td></tr><tr><td>Справжніх листів, прийнятих за фішинг</td><td>${falseAl}</td></tr>
   <tr><td>Час</td><td>${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</td></tr><tr><td><b>Рахунок</b></td><td>${total} з ${max} (${pct}%)</td></tr></table>
   <p>Код результату для вчителя: <span class="code">${code}</span></p>
   <p style="line-height:1.6">🔍 Перевіряй домен відправника до останньої літери · 🖱 Наводь курсор на посилання перед кліком · ⏰ Поспіх і погрози — привід зупинитися · 📎 .exe, .scr, .js у вкладенні — не відкривати · 💳 Ніхто не просить коди, паролі й дані картки поштою · 📞 Сумніваєшся — перевір через інший канал зв’язку.</p>
   <div class="row"><button class="btn" id="copy">📋 Копіювати результат</button><button class="btn" id="prn">🖨 Друк / PDF</button><button class="btn primary" id="again">Ще раз</button></div></div>`;
  $('copy').onclick=e=>{const b=e.target;try{navigator.clipboard.writeText(summary).then(()=>b.textContent='✅ Скопійовано',()=>b.textContent='Не вдалося скопіювати');}catch(err){b.textContent='Не вдалося скопіювати';}};
  $('prn').onclick=()=>{try{window.print();}catch(e){}};
  $('again').onclick=start;
}

start();
</script>
