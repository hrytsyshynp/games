<style>

  .choice.picked.best{border-color:var(--ok);background:#1b4a3e}
  .choice.picked.ok{border-color:var(--mid);background:#4a4019}
  .choice.picked.bad{border-color:var(--bad);background:#4d2424}

  .fb.best{background:#1b4a3e}.fb.ok{background:#4a4019}.fb.bad{background:#4d2424}
  @keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
  .row{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:12px}
  button.btn{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer}

  .card h3{margin:0 0 4px;font-size:16px}
  .card p{margin:3px 0;font-size:14px;line-height:1.45}

</style>

   Формат: ГРА-БАЛИ-ДДММ-КОНТРОЛЬ. Контрольна частина залежить від гри, балів,
   дати та повного імені учня. Перевірка — сторінка «Перевірка результатів». */
function normName(n){ return String(n||'').toLowerCase().replace(/[’ʼ`´]/g,"'").replace(/\s+/g,' ').trim(); }
function codeSig(g,score,dm,name){
  const s=[g,score,dm,normName(name),'kiberihry-2026'].join('|');
  let h=2166136261>>>0; for(const ch of s){ h^=ch.codePointAt(0); h=Math.imul(h,16777619)>>>0; }
  const A='23456789ABCDEFGHJKMNPQRSTUVWXYZ'; let r=''; for(let i=0;i<4;i++){ r+=A[h%31]; h=Math.floor(h/31); } return r;
}
function makeCode(g,score,name){
  const d=new Date(), dm=String(d.getDate()).padStart(2,'0')+String(d.getMonth()+1).padStart(2,'0');
  return g+'-'+score+'-'+dm+'-'+codeSig(g,score,dm,name);
}

 {time:'21:15', place:'Соцмережа', em:'🎂', title:'Фото з дня народження',
  lesson:'Персональні дані в інформаційних системах',
  text:'Ти хочеш викласти фото з дня народження друга. На фото видно його обличчя, табличку з назвою вулиці, а в застосунку увімкнений геотег.',
  choices:[
   {t:'Викласти з геотегом і позначкою друга — хай усі бачать', kind:'bad', fx:[-5,-20,10],
    why:'Ти публікуєш чужі персональні дані — обличчя, ім’я, місце — без згоди людини.',
    cons:'Фото друга з геотегом і назвою вулиці стало публічним.'},
   {t:'Спитати згоди друга, прибрати геотег і табличку з кадру', kind:'best', fx:[10,20,-5],
    why:'Згода і мінімум зайвих деталей — два правила будь-якої публікації про інших людей.'},
   {t:'Викласти в сторіз «тільки для близьких», не питаючи', kind:'ok', fx:[0,-5,5],
    why:'Аудиторія менша, але згоду друга все одно варто спитати — і скриншот сторіз може зробити будь-хто.'}
  ]}
];

const ENDINGS = [
 {min:80, icon:'🏆', title:'Кіберпрофі', text:'Твій день минув без жодного інциденту. Ти знаходиш баланс між зручністю і безпекою — і захищаєш не лише себе, а й інших.'},
 {min:60, icon:'🛡️', title:'Обережний користувач', text:'Більшість рішень були правильними. Кілька ризикованих моментів — і варто розібратися, що з ними не так.'},
 {min:40, icon:'⚠️', title:'Ризикований день', text:'Зручність часто перемагала безпеку. Подивись, до чого могли призвести окремі рішення.'},
 {min:0,  icon:'💥', title:'Цифровий хаос', text:'Цей день міг закінчитися зламом акаунтів і витоком даних. Добре, що це лише гра — спробуй ще раз!'}
];

/* ===================================================================== */
const $ = id => document.getElementById(id);
let S;
function fresh(){ return {player:'', i:0, m:{sec:50,priv:50,conv:50}, picks:[], t0:Date.now(), order:[]}; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const clamp = v => Math.max(0, Math.min(100, v));

function drawMeters(delta){
  $('meters').innerHTML = METERS.map((m,k)=>{
    const d = delta ? delta[k] : 0;
    return `<div class="meter"><div class="top"><span>${m.icon} ${m.name}<span class="delta ${d?'show':''}" style="color:${d>0?'var(--ok)':'var(--bad)'}">${d>0?'+':''}${d||''}</span></span><b>${S.m[m.key]}</b></div>
      <div class="bar"><i style="width:${S.m[m.key]}%;background:${m.color}"></i></div></div>`;
  }).join('');
}
function drawDots(){
  $('dots').innerHTML = SCENES.map((s,k)=>`<i class="${S.picks[k]?S.picks[k].kind:''} ${k===S.i&&k<SCENES.length?'cur':''}" title="${s.time} ${esc(s.title)}"></i>`).join('');
  $('prog').textContent = S.i < SCENES.length ? `Сцена ${S.i+1} з ${SCENES.length}` : 'День завершено';
}
function sky(){
  const h = S.i < SCENES.length ? parseInt(SCENES[S.i].time) : 23;
  const c = h<9 ? '#4a6a9c' : h<13 ? '#3d5f99' : h<17 ? '#4b4f8a' : h<20 ? '#5a3f78' : '#1f2550';
  document.body.style.background = `radial-gradient(1000px 520px at 50% -160px, ${c}, var(--bg))`;
}

function start(){
  S = fresh(); drawMeters(); drawDots(); sky();
  $('scene').innerHTML = `<div class="hero"><div class="em">🌇</div><div><div class="clock"><b>07:00</b>Твій звичайний день</div><h2>Один день онлайн</h2></div></div>
   <div class="body">
    <p>Від будильника до сну ти ухвалиш <b>${SCENES.length} рішень</b> — у школі, в кафе, вдома й у соцмережах. Кожне впливає на три шкали:</p>
    ${METERS.map(m=>`<div class="card"><div class="big">${m.icon}</div><div><h3>${m.name}</h3><p>${m.key==='sec'?'Наскільки захищені твої акаунти й пристрої.':m.key==='priv'?'Наскільки захищені твої персональні дані — і дані інших людей.':'Наскільки швидко й просто тобі все вдається. Іноді безпека трохи незручна — і це нормально.'}</p></div></div>`).join('')}
    <p class="muted">Немає «тупикових» відповідей: після кожного вибору ти побачиш пояснення, а в кінці — до чого привели твої рішення.</p>
    <label>Твоє ім’я та клас:<br><input type="text" id="pname" maxlength="40" placeholder="Напр.: Денис М., 10-А"></label>
    <div class="row"><button class="btn primary" id="go">Почати день ☀️</button></div>
   </div>`;
  $('go').onclick = () => { S.player = ($('pname').value||'').trim() || 'Гравець'; S.t0 = Date.now(); scene(); };
}

function scene(){
  if (S.i >= SCENES.length) return finish();
  sky(); drawDots(); drawMeters();
  const sc = SCENES[S.i];
  const order = sc.choices.map((c,k)=>k).sort(()=>Math.random()-.5);
  $('scene').innerHTML = `<div class="hero"><div class="em">${sc.em}</div><div><div class="clock"><b>${sc.time}</b>${esc(sc.place)}</div><h2>${esc(sc.title)}</h2></div></div>
    <div class="body"><p>${esc(sc.text)}</p><div id="ch"></div><div id="fb"></div></div>`;
  const box = $('ch');
  order.forEach(k=>{
    const c = sc.choices[k];
    const b = document.createElement('button'); b.className='choice'; b.textContent = c.t;
    b.onclick = () => choose(k, b);
    box.appendChild(b);
  });
}

function choose(k, btn){
  const sc = SCENES[S.i], c = sc.choices[k];
  document.querySelectorAll('.choice').forEach(b=>b.disabled = true);
  btn.classList.add('picked', c.kind);
  const fx = c.fx.map(d => d>0 ? Math.round(d*0.5) : d); // прибуток повільніший, ніж втрати
  METERS.forEach((m,j)=>S.m[m.key] = clamp(S.m[m.key] + fx[j]));
  S.picks[S.i] = {kind:c.kind, choice:k};
  drawMeters(fx); drawDots();
  const head = c.kind==='best' ? '✅ Чудове рішення!' : c.kind==='ok' ? '🟡 Непогано, але є краще.' : '❌ Ризиковано.';
  const best = sc.choices.find(x=>x.kind==='best');
  $('fb').innerHTML = `<div class="fb ${c.kind}"><b>${head}</b> ${c.why}${c.kind!=='best'?`<br><br><b>Найкраще рішення:</b> ${esc(best.t)}.`:''}</div>
    <div class="row"><button class="btn primary" id="next">${S.i+1<SCENES.length?'Далі →':'Завершити день 🌙'}</button></div>`;
  $('next').onclick = () => { S.i++; scene(); window.scrollTo({top:0,behavior:'smooth'}); };
  $('next').focus();
}

function finish(){
  sky(); drawDots(); drawMeters();
  const best = S.picks.filter(p=>p.kind==='best').length, ok = S.picks.filter(p=>p.kind==='ok').length, bad = S.picks.filter(p=>p.kind==='bad').length;
  const score = best*100 + ok*50;
  const max = SCENES.length*100;
  const pct = Math.round(score/max*100);
  const level = Math.round((S.m.sec + S.m.priv)/2);
  const end = ENDINGS.find(e=>pct >= e.min);
  const chk = (score*13 + S.player.length*5 + best*7) % 97;
  const code = makeCode('ОД',score,S.player);
  const secs = Math.floor((Date.now()-S.t0)/1000);
  const date = new Date().toLocaleString('uk-UA',{dateStyle:'medium',timeStyle:'short'});
  const cons = SCENES.map((sc,k)=>({sc, c: sc.choices[S.picks[k].choice]})).filter(x=>x.c.cons);
  const summary = `Один день онлайн — ${S.player}, ${date}\nНайкращих рішень: ${best}/${SCENES.length}; прийнятних: ${ok}; ризикованих: ${bad}\nБезпека: ${S.m.sec}; приватність: ${S.m.priv}; зручність: ${S.m.conv}\nБали: ${score} (${pct}%); код: ${code}\nУчень: ${S.player}\nКод: ${code}`;
  $('scene').innerHTML = `<div class="hero"><div class="em">${end.icon}</div><div><div class="clock"><b>23:00</b>День завершено</div><h2>${end.title}</h2></div></div>
   <div class="body">
    <p><b>${esc(S.player)}</b> · ${date}</p>
    <p>${end.text}</p>
    <table class="res">
      <tr><td>✅ Найкращих рішень</td><td>${best} з ${SCENES.length}</td></tr>
      <tr><td>🟡 Прийнятних</td><td>${ok}</td></tr>
      <tr><td>❌ Ризикованих</td><td>${bad}</td></tr>
      <tr><td>🛡 Безпека / 🔒 Приватність / ⚡ Зручність</td><td>${S.m.sec} / ${S.m.priv} / ${S.m.conv}</td></tr>
      <tr><td>Час</td><td>${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</td></tr>
      <tr><td><b>Загальний рахунок</b></td><td>${score} (${pct}%)</td></tr>
    </table>
    <p>Код результату для вчителя: <span class="code">${code}</span></p>
    ${cons.length?`<h3>Що сталося через ризиковані рішення</h3>`+cons.map(x=>`<div class="card"><div class="big">${x.sc.em}</div><div><h3>${x.sc.time} · ${esc(x.sc.title)}</h3><p>${esc(x.c.cons)}</p><p class="muted">Краще: ${esc(x.sc.choices.find(z=>z.kind==='best').t)}.</p></div></div>`).join(''):'<p>✅ Жодне рішення не призвело до проблем. Так тримати!</p>'}
    <h3>Правила дня</h3>
    <p>📱 Мінімум дозволів застосункам · 🔄 Оновлення — вчасно · 🏫 На чужих пристроях — вихід з акаунта · 📎 Невідомі файли не відкриваємо · 🔑 Унікальні паролі + 2FA · 📧 Групі — у прихованій копії · ☕ Банк — не через відкритий Wi-Fi · 📞 Коди з SMS — нікому · 📷 Розумні пристрої — новий пароль одразу · 🤝 Чужі фото — лише зі згоди.</p>
    <div class="row">
      <button class="btn" id="copy">📋 Копіювати результат</button>
      <button class="btn" id="prn">🖨 Друк / PDF</button>
      <button class="btn primary" id="again">Прожити день ще раз</button>
    </div>
   </div>`;
  $('copy').onclick = e => { const b=e.target; try{ navigator.clipboard.writeText(summary).then(()=>b.textContent='✅ Скопійовано',()=>b.textContent='Не вдалося скопіювати'); }catch(err){ b.textContent='Не вдалося скопіювати'; } };
  $('prn').onclick = () => { try{ window.print(); }catch(e){} };
  $('again').onclick = start;
  try{ const bst=+localStorage.getItem('dayBest')||0; if(score>bst) localStorage.setItem('dayBest',score); }catch(e){}
}

start();
</script>
</body>
</html>
