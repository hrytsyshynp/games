<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Курсова зникла — квест про резервне копіювання</title>
<style>
  :root{
    --bg:#e9eef4; --win:#ffffff; --bar:#f3f6fa; --line:#d5dde8; --text:#1d2a3a; --muted:#66768c;
    --acc:#0f9d8a; --acc2:#0b7a6b; --ok:#1f9d55; --mid:#d69e2e; --bad:#e04848;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
       background:linear-gradient(160deg,#dfe8f1,#eef2f6 40%,#e3ecf3)}
  .wrap{max-width:780px;margin:0 auto;padding:14px}
  .win{background:var(--win);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(30,50,80,.15);overflow:hidden}
  .titlebar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
  .titlebar .dots{display:flex;gap:6px}.titlebar .dots i{width:11px;height:11px;border-radius:50%;display:block}
  .titlebar .dots i:nth-child(1){background:#ff5f57}.titlebar .dots i:nth-child(2){background:#febc2e}.titlebar .dots i:nth-child(3){background:#28c840}
  .titlebar .path{flex:1;font-family:Consolas,monospace;background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .copies{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);background:#fbfcfe}
  .copy{display:flex;align-items:center;gap:6px;font-size:13px;padding:5px 10px;border-radius:20px;border:1px dashed var(--line);color:var(--muted);transition:.3s}
  .copy.on{border-style:solid;border-color:var(--acc);color:var(--acc2);background:#e3f6f2;font-weight:600}
  .copy.warn{border-style:solid;border-color:var(--mid);color:#8a5a00;background:#fdf3dc}
  .days{display:flex;gap:4px;padding:10px 12px 0;flex-wrap:wrap}
  .days span{font-size:12px;padding:3px 8px;border-radius:6px;background:#eef2f7;color:var(--muted)}
  .days span.cur{background:var(--acc);color:#fff}
  .days span.best{background:#d7f2e2;color:#16683b}.days span.ok{background:#fbeccb;color:#7a5200}.days span.bad{background:#fbd9d9;color:#8e1f1f}
  .body{padding:16px 18px 18px}
  .head{display:flex;gap:14px;align-items:center;margin-bottom:6px}
  .file{width:58px;height:70px;border-radius:6px 16px 6px 6px;background:linear-gradient(180deg,#2b78e4,#1c5bb8);color:#fff;display:flex;align-items:flex-end;justify-content:center;font-weight:700;font-size:13px;padding-bottom:8px;flex:none;position:relative}
  .file.lost{background:linear-gradient(180deg,#b9c3d0,#8e99a8)}
  .file.enc{background:linear-gradient(180deg,#e04848,#a32121)}
  .file .ic{position:absolute;top:10px;font-size:24px}
  h1{margin:0;font-size:21px}
  .sub{color:var(--muted);font-size:13.5px}
  p{line-height:1.55;font-size:15.5px;margin:8px 0 12px}
  .choice{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:8px 0;padding:11px 13px;border-radius:10px;font:inherit;font-size:15px;
          color:var(--text);background:#f7f9fc;border:1px solid var(--line);cursor:pointer;transition:.12s}
  .choice:before{content:"📁";flex:none}
  .choice:hover:not(:disabled){border-color:var(--acc);background:#eefaf7}
  .choice:disabled{cursor:default;opacity:.55}
  .choice.picked{opacity:1;border-width:2px}
  .choice.picked.best{border-color:var(--ok);background:#e3f6ea}.choice.picked.ok{border-color:var(--mid);background:#fdf3dc}.choice.picked.bad{border-color:var(--bad);background:#fde5e5}
  .fb{border-left:4px solid;border-radius:6px;padding:10px 13px;margin-top:10px;line-height:1.5;font-size:14.5px;background:#f7f9fc}
  .fb.best{border-color:var(--ok)}.fb.ok{border-color:var(--mid)}.fb.bad{border-color:var(--bad)}
  .row{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}
  .btn{font:inherit;font-size:14.5px;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  .btn.primary:hover{background:var(--acc2)}
  input[type=text]{width:100%;font:inherit;padding:9px 11px;border-radius:8px;border:1px solid var(--line)}
  .alert{background:#1d2a3a;color:#fff;border-radius:10px;padding:14px 16px;margin:10px 0;font-family:Consolas,monospace;font-size:14px;line-height:1.5}
  .alert.red{background:#5b1111}
  .progress{height:14px;border-radius:8px;background:#e6ebf2;overflow:hidden;margin:6px 0 2px}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#3bc9a8);width:0;transition:width 1.6s ease}
  table.res{width:100%;border-collapse:collapse;font-size:14.5px;margin:8px 0}
  table.res td{padding:6px 4px;border-bottom:1px solid var(--line)}
  table.res td:last-child{text-align:right;font-weight:600}
  .code{font-family:Consolas,monospace;font-size:19px;border:1px dashed var(--acc);border-radius:8px;padding:6px 12px;display:inline-block;background:#eefaf7}
  .rule{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
  .rule div{background:#f3f7fb;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-size:13.5px}
  .rule b{display:block;font-size:30px;color:var(--acc2)}
  .muted{color:var(--muted)}
  @media (max-width:520px){.rule{grid-template-columns:1fr}}
  @media print{body{background:#fff}.copies,.days,.row,.titlebar{display:none}.win{box-shadow:none}}
</style>
</head>
<body>
<div class="wrap">
 <div class="win">
  <div class="titlebar"><div class="dots"><i></i><i></i><i></i></div><div class="path" id="path">C:\Users\Учень\Desktop\Проєкт.docx</div></div>
  <div class="copies" id="copies"></div>
  <div class="days" id="days"></div>
  <div class="body" id="scene"></div>
 </div>
</div>

<script>
/* ===== Код результату для вчителя (однаковий в усіх іграх комплекту) =====
   Формат: ГРА-БАЛИ-ДДММ-КОНТРОЛЬ. Контрольна частина залежить від гри, балів,
   дати та повного імені учня. Перевірка — сторінка «Перевірка результатів». */
function normName(n){ return String(n||'').toLowerCase().replace(/[’ʼ`´]/g,"'").replace(/\s+/g,' ').trim(); }
function codeSig(g,score,dm,name){
  const s=[g,score,dm,normName(name),'kiberihry-2026'].join('|');
  let h=2166136261>>>0; for(const ch of s){ h^=ch.codePointAt(0); h=Math.imul(h,16777619)>>>0; }
  const A='23456789ABCDEFGHJKMNPQRSTUVWXYZ'; let r=''; for(let i=0;i<4;i++){ r+=A[h%31]; h=Math.floor(h/31); } return r;
}
function makeCode(g,score,name){
  const d=new Date(), dm=String(d.getDate()).padStart(2,'0')+String(d.getMonth()+1).padStart(2,'0');
  return g+'-'+score+'-'+dm+'-'+codeSig(g,score,dm,name);
}

/* =====================================================================
   НАЛАШТУВАННЯ — учитель може змінювати тексти сцен і пояснення.
   Тема: «Резервне копіювання та відновлення даних» (Тема 1.6, 7.5).
   kind: best — найкраще рішення, ok — прийнятне, bad — ризиковане.
   set — які «прапорці» вмикає вибір (від них залежить фінальне відновлення).
   ===================================================================== */
const COPIES = [
  {key:'cloud',  icon:'☁️', name:'Хмара'},
  {key:'hist',   icon:'🕓', name:'Історія версій'},
  {key:'ext',    icon:'💾', name:'Зовнішній диск'},
  {key:'flash',  icon:'🔌', name:'Флешка'},
  {key:'tested', icon:'🧪', name:'Копію перевірено'}
];

const SCENES = [
 {day:'День 1', title:'Де зберігати проєкт?', path:'C:\\Users\\Учень\\Desktop\\Проєкт.docx',
  text:'Ти починаєш індивідуальний навчальний проєкт, здати його треба за два тижні. Документ створено на робочому столі ноутбука. Де він житиме далі?',
  choices:[
   {t:'Залишити на робочому столі — так найзручніше', kind:'bad', set:{},
    why:'Одна копія на одному пристрої — це нуль резервних копій. Поломка, крадіжка чи вірус — і проєкту немає.'},
   {t:'Перенести в хмарну папку, яка синхронізується з ноутбуком', kind:'best', set:{cloud:1,hist:1},
    why:'Хмарне сховище зберігає копію поза ноутбуком і, як правило, веде історію версій файлу — до неї можна повернутися.'},
   {t:'Залишити на робочому столі, а раз на місяць скидати на флешку', kind:'ok', set:{flash:1},
    why:'Краще, ніж нічого, але копія раз на місяць застаріває: за тиждень роботи можна втратити кілька розділів.'}
  ]},
 {day:'День 3', title:'Зовнішній диск', path:'E:\\Backup\\',
  text:'Тато віддав тобі старий зовнішній диск на 500 ГБ. Як ним скористатися?',
  choices:[
   {t:'Раз на тиждень копіювати на нього проєкт і після цього відключати диск', kind:'best', set:{ext:'off'},
    why:'Відключений диск — це «офлайн-копія»: до неї не дістануться ні вірус-вимагач, ні стрибок напруги.'},
   {t:'Тримати диск підключеним постійно, щоб копіювалося автоматично', kind:'ok', set:{ext:'on'},
    why:'Автоматично — зручно, але постійно підключений диск програма-вимагач зашифрує разом з усім іншим.'},
   {t:'Не потрібно — у мене вже все є', kind:'ok', set:{},
    why:'Одна додаткова копія — це добре, дві в різних місцях — значно надійніше. Про це правило 3-2-1.'}
  ]},
 {day:'День 5', title:'Нові версії', path:'C:\\...\\Проєкт_фінал_точно_фінал2.docx',
  text:'Учитель повернув проєкт із зауваженнями. Ти переписуєш другий розділ, але старий варіант теж може знадобитися.',
  choices:[
   {t:'Користуватися історією версій сервісу, а ключові етапи позначати назвою', kind:'best', set:{hist:1},
    why:'Історія версій дає змогу повернути будь-який попередній стан файлу, не плодячи десятки копій.', need:'cloud'},
   {t:'Робити копії «Проєкт_v1», «Проєкт_v2» з датою в назві', kind:'ok', set:{manual:1},
    why:'Порядок у версіях — добре. Але всі вони лежать в одній папці на тому самому диску.'},
   {t:'Просто перезаписати файл — старе вже не потрібне', kind:'bad', set:{},
    why:'Якщо нова версія виявиться гіршою або файл пошкодиться під час збереження — повернути нічого не вийде.'}
  ]},
 {day:'День 7', title:'А копія взагалі працює?', path:'E:\\Backup\\Проєкт.docx',
  text:'Ти вже маєш резервні копії. Чи варто щось із ними робити?',
  choices:[
   {t:'Відкрити файл із резервної копії й переконатися, що в ньому всі розділи', kind:'best', set:{tested:1},
    why:'Неперевірена копія — це лише надія. Буває, що копіюється не той файл або порожня папка.'},
   {t:'Нічого — копії ж зроблено', kind:'bad', set:{},
    why:'Більшість людей дізнаються, що копія не працює, саме тоді, коли вона потрібна.'},
   {t:'Подивитися лише, чи є файл у папці', kind:'ok', set:{},
    why:'Файл є — ще не означає, що він відкривається і містить останню версію.'}
  ]},
 {day:'День 9', title:'Лист від «антиплагіату»', path:'Пошта › Вхідні',
  text:'Приходить лист: «Ваш проєкт не пройшов перевірку на плагіат! Терміново відкрийте звіт: zvit_antiplagiat.zip». Відправник — antiplagiat-check@mail-service.top.',
  choices:[
   {t:'Відкрити архів — треба ж знати, що не так', kind:'bad', set:{ransom:1},
    why:'Терміновість, лякаючий текст, архів і чужий домен — класичні ознаки фішингу. Усередині такого архіву часто буває вимагач.'},
   {t:'Не відкривати, перевірити інформацію в учителя', kind:'best', set:{},
    why:'Офіційні результати перевірки повідомляє вчитель або навчальна платформа, а не незнайомий відправник.'},
   {t:'Переслати другу, щоб він перевірив на своєму ноутбуці', kind:'bad', set:{},
    why:'Так ти наражаєш на небезпеку інших. Підозрілі вкладення не пересилають.'}
  ]}
];

const RULE_SCENE = {day:'День 12', title:'Правило 3-2-1',
  text:'Учитель просить кожного назвати свою схему резервного копіювання. Яка з них відповідає правилу 3-2-1?',
  choices:[
   {t:'Оригінал на ноутбуці + копія на зовнішньому диску + копія в хмарі', kind:'best',
    why:'3 копії даних, 2 різні типи носіїв (внутрішній і зовнішній диск), 1 копія поза домом (хмара).'},
   {t:'Три копії файлу в різних папках на ноутбуці', kind:'bad',
    why:'Копій три, але носій один. Поломка диска знищить їх усі одночасно.'},
   {t:'Оригінал на ноутбуці + дві флешки в одній шухляді', kind:'ok',
    why:'Копій вистачає, але всі зберігаються в одному місці: пожежа чи крадіжка — і даних немає.'}
  ]};

/* ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S;
const ALL = () => [...SCENES.map(s=>s.day), 'Аварія', RULE_SCENE.day];
function fresh(){ return {player:'', i:0, f:{}, picks:[], t0:Date.now(), recovery:0, crisis:''}; }

function drawCopies(){
  $('copies').innerHTML = COPIES.map(c=>{
    let cls = S.f[c.key] ? 'on' : '';
    if (c.key==='ext' && S.f.ext==='on') cls = 'warn';
    const label = c.key==='ext' && S.f.ext ? (S.f.ext==='on'?'Диск (постійно підключений)':'Диск (офлайн)') : c.name;
    return `<span class="copy ${cls}">${c.icon} ${label}</span>`;
  }).join('');
}
function drawDays(cur){
  $('days').innerHTML = ALL().map((d,k)=>`<span class="${S.picks[k]?S.picks[k].kind:''} ${k===cur?'cur':''}">${d}</span>`).join('');
}

function start(){
  S = fresh(); drawCopies(); drawDays(-1);
  $('path').textContent = 'C:\\Users\\Учень\\Desktop\\Проєкт.docx';
  $('scene').innerHTML = `<div class="head"><div class="file"><span class="ic">📝</span>DOCX</div><div><h1>Курсова зникла</h1><div class="sub">Квест про резервне копіювання та відновлення даних</div></div></div>
    <p>Попереду два тижні роботи над проєктом. Ти ухвалиш кілька рішень про те, де і як зберігати файл. А потім станеться <b>аварія</b> — і лише від твоїх рішень залежатиме, скільки роботи вдасться врятувати.</p>
    <p class="muted">Угорі видно, які резервні копії в тебе вже є. Після кожного вибору — пояснення.</p>
    <label>Твоє ім’я та клас:<br><input type="text" id="pname" maxlength="40" placeholder="Напр.: Ірина К., 11-Б"></label>
    <div class="row"><button class="btn primary" id="go">Почати проєкт →</button></div>`;
  $('go').onclick = () => { S.player = ($('pname').value||'').trim() || 'Гравець'; S.t0 = Date.now(); scene(); };
}

function render(sc, idx, onPick){
  $('path').textContent = sc.path || 'C:\\Users\\Учень\\Documents\\';
  drawDays(idx); drawCopies();
  const order = sc.choices.map((c,k)=>k).sort(()=>Math.random()-.5);
  $('scene').innerHTML = `<div class="head"><div class="file"><span class="ic">📝</span>DOCX</div><div><div class="sub">${esc(sc.day)}</div><h1>${esc(sc.title)}</h1></div></div>
    <p>${esc(sc.text)}</p><div id="ch"></div><div id="fb"></div>`;
  order.forEach(k=>{
    const b = document.createElement('button'); b.className='choice'; b.textContent = sc.choices[k].t;
    b.onclick = () => {
      document.querySelectorAll('.choice').forEach(x=>x.disabled=true);
      const c = sc.choices[k]; b.classList.add('picked', c.kind);
      S.picks[idx] = {kind:c.kind};
      onPick && onPick(c);
      drawCopies(); drawDays(idx);
      const head = c.kind==='best'?'✅ Чудове рішення.':c.kind==='ok'?'🟡 Непогано, але є краще.':'❌ Ризиковано.';
      const best = sc.choices.find(x=>x.kind==='best');
      $('fb').innerHTML = `<div class="fb ${c.kind}"><b>${head}</b> ${esc(c.why)}${c.kind!=='best'?`<br><b>Найкраще:</b> ${esc(best.t)}.`:''}</div>
        <div class="row"><button class="btn primary" id="next">Далі →</button></div>`;
      $('next').onclick = () => { S.i++; scene(); window.scrollTo({top:0,behavior:'smooth'}); };
      $('next').focus();
    };
    $('ch').appendChild(b);
  });
}

function scene(){
  if (S.i < SCENES.length) return render(SCENES[S.i], S.i, c => { for (const k in c.set){ if (k==='hist' && !S.f.cloud && !c.set.cloud) continue; S.f[k]=c.set[k]; } });
  if (S.i === SCENES.length) return crisis();
  if (S.i === SCENES.length+1) return render(RULE_SCENE, S.i);
  finish();
}

/* Аварія: результат залежить від зібраних «прапорців» */
function crisis(){
  const f = S.f, ransom = !!f.ransom;
  const opts = []; // [відсоток, пояснення]
  if (ransom){
    if (f.cloud && f.hist) opts.push([100,'☁️ У хмарі синхронізувалася зашифрована версія, але через історію версій ти повернув учорашній стан файлу.']);
    else if (f.cloud) opts.push([0,'☁️ Хмара синхронізувала вже зашифрований файл — без історії версій повернути оригінал не вдалося.']);
    if (f.ext==='off') opts.push([f.tested?90:45, f.tested?'💾 Офлайн-копія на диску вціліла: втрачено лише роботу за кілька днів.':'💾 Офлайн-копія вціліла, але виявилося, що туди скопіювалась стара чернетка без двох розділів.']);
    if (f.ext==='on') opts.push([0,'💾 Постійно підключений диск вимагач зашифрував разом з ноутбуком.']);
    if (f.manual) opts.push([0,'🗂 Файли «v1», «v2» лежали на тому самому диску — їх теж зашифровано.']);
    if (f.flash) opts.push([f.tested?40:25,'🔌 На флешці знайшлася копія, але їй уже майже місяць.']);
  } else {
    if (f.cloud) opts.push([100,'☁️ Файл у хмарі в повній безпеці — ти просто відкрив його на іншому комп’ютері.']);
    if (f.ext) opts.push([f.tested?90:45, f.tested?'💾 Копія на зовнішньому диску ціла: втрачено лише роботу за кілька днів.':'💾 Копія на диску є, але неповна — її ніхто не перевіряв.']);
    if (f.flash) opts.push([f.tested?40:25,'🔌 На флешці знайшлася копія, але їй уже майже місяць.']);
    if (f.manual) opts.push([0,'🗂 Файли «v1», «v2» зберігалися на тому самому диску, що зламався.']);
  }
  const pct = opts.length ? Math.max(...opts.map(o=>o[0])) : 0;
  S.recovery = pct; S.crisis = ransom ? 'ransom' : 'disk';
  S.picks[S.i] = {kind: pct>=90?'best':pct>=40?'ok':'bad'};
  drawDays(S.i); $('path').textContent = ransom ? 'C:\\Users\\Учень\\Desktop\\Проєкт.docx.locked' : 'C:\\ — диск не знайдено';
  $('scene').innerHTML = `<div class="head"><div class="file ${ransom?'enc':'lost'}"><span class="ic">${ransom?'🔒':'💥'}</span>${ransom?'LOCKED':'???'}</div><div><div class="sub">День 10 · Аварія</div><h1>${ransom?'Файли зашифровано!':'Ноутбук не вмикається'}</h1></div></div>
    ${ransom?`<div class="alert red">ВАШІ ФАЙЛИ ЗАШИФРОВАНО.<br>Щоб отримати ключ, переведіть 0,05 BTC протягом 48 годин.<br>Проєкт.docx.locked · Фото.locked · …</div>
      <p>Архів «звіту антиплагіату» виявився програмою-вимагачем. Платити не можна: ніхто не гарантує, що ключ надішлють, а гроші підуть злочинцям. Залишається резервне копіювання.</p>`
     :`<div class="alert">ERROR: No bootable device found.<br>Check cable connection and drive settings.</div>
      <p>За три дні до здачі жорсткий диск ноутбука вийшов з ладу. Сервісний центр каже: «Дані з цього диска, найімовірніше, не відновити». Що ж у тебе є?</p>`}
    <p><b>Відновлення проєкту:</b> <span id="pctv">0</span>%</p>
    <div class="progress"><i id="pbar"></i></div>
    <div id="det"></div>
    <div class="row"><button class="btn primary" id="next">Далі →</button></div>`;
  setTimeout(()=>{ if(!$('pbar')) return; $('pbar').style.width = pct+'%'; let v=0; const t=setInterval(()=>{ const el=$('pctv'); if(!el){ clearInterval(t); return; } v=Math.min(pct,v+4); el.textContent=v; if(v>=pct) clearInterval(t); },50); },150);
  $('det').innerHTML = (opts.length ? opts.map(o=>`<div class="fb ${o[0]>=90?'best':o[0]>0?'ok':'bad'}">${esc(o[1])}</div>`).join('')
       : `<div class="fb bad">У тебе не було жодної резервної копії. Проєкт доведеться писати з нуля.</div>`);
  $('next').onclick = () => { S.i++; scene(); window.scrollTo({top:0,behavior:'smooth'}); };
}

function finish(){
  drawDays(-1);
  const kinds = S.picks.filter(Boolean);
  const best = kinds.filter(p=>p.kind==='best').length, ok = kinds.filter(p=>p.kind==='ok').length, bad = kinds.filter(p=>p.kind==='bad').length;
  const decisions = S.picks.filter((p,k)=>k!==SCENES.length);
  const score = decisions.reduce((s,p)=>s+(p.kind==='best'?100:p.kind==='ok'?50:0),0) + S.recovery*2;
  const max = (SCENES.length+1)*100 + 200;
  const pct = Math.round(score/max*100);
  const chk = (score*11 + S.player.length*7 + S.recovery) % 97;
  const code = makeCode('КЗ',score,S.player);
  const secs = Math.floor((Date.now()-S.t0)/1000);
  const date = new Date().toLocaleString('uk-UA',{dateStyle:'medium',timeStyle:'short'});
  const title = S.recovery>=90?'🏆 Проєкт врятовано':S.recovery>=40?'🛟 Частково врятовано':'💔 Проєкт втрачено';
  const summary = `Курсова зникла — ${S.player}, ${date}\nРішень: найкращих ${best}, прийнятних ${ok}, ризикованих ${bad}\nВідновлено проєкту: ${S.recovery}% (аварія: ${S.crisis==='ransom'?'вимагач':'поломка диска'})\nБали: ${score} з ${max} (${pct}%); код: ${code}\nУчень: ${S.player}\nКод: ${code}`;
  $('path').textContent = 'C:\\Users\\Учень\\Documents\\Звіт.txt';
  $('scene').innerHTML = `<div class="head"><div class="file"><span class="ic">📊</span>REPORT</div><div><div class="sub">${esc(S.player)} · ${date}</div><h1>${title}</h1></div></div>
    <table class="res">
      <tr><td>✅ Найкращих рішень</td><td>${best}</td></tr>
      <tr><td>🟡 Прийнятних</td><td>${ok}</td></tr>
      <tr><td>❌ Ризикованих</td><td>${bad}</td></tr>
      <tr><td>Аварія</td><td>${S.crisis==='ransom'?'програма-вимагач':'поломка диска'}</td></tr>
      <tr><td>Відновлено проєкту</td><td>${S.recovery}%</td></tr>
      <tr><td>Час</td><td>${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</td></tr>
      <tr><td><b>Загальний рахунок</b></td><td>${score} з ${max} (${pct}%)</td></tr>
    </table>
    <p>Код результату для вчителя: <span class="code">${code}</span></p>
    <h3>Запам’ятай: правило 3-2-1</h3>
    <div class="rule"><div><b>3</b>копії даних</div><div><b>2</b>різні типи носіїв</div><div><b>1</b>копія поза домом</div></div>
    <p class="muted">💾 Офлайн-копію відключай після копіювання · 🕓 Історія версій рятує від вимагачів · 🧪 Копію треба перевіряти · 📎 Невідомі архіви не відкривай.</p>
    <div class="row">
      <button class="btn" id="copy">📋 Копіювати результат</button>
      <button class="btn" id="prn">🖨 Друк / PDF</button>
      <button class="btn primary" id="again">Пройти ще раз</button>
    </div>`;
  $('copy').onclick = e => { const b=e.target; try{ navigator.clipboard.writeText(summary).then(()=>b.textContent='✅ Скопійовано',()=>b.textContent='Не вдалося скопіювати'); }catch(err){ b.textContent='Не вдалося скопіювати'; } };
  $('prn').onclick = () => { try{ window.print(); }catch(e){} };
  $('again').onclick = start;
}

start();
</script>
</body>
</html>
